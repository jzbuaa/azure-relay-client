name: Build installer

on:
  push:
    tags:
      - 'v_*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Read version from tag
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v_((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Invalid release tag '$env:GITHUB_REF_NAME'. Use v_1.2.3 or v_1.2.3-beta.1."
          }
          $version = $Matches[1]
          $null = [System.Management.Automation.SemanticVersion]::Parse($version)
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build installer package
        run: dotnet pack .\relay-client.csproj --configuration Release --output .\bin\nupkg "-p:Version=$env:RELEASE_VERSION"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-client-${{ env.RELEASE_VERSION }}
          path: bin\nupkg\*.nupkg
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Item ".\bin\nupkg\relay-client.$env:RELEASE_VERSION.nupkg"
          $releaseTags = @(
            gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to check existing releases."
          }
          if ($releaseTags -ccontains $env:GITHUB_REF_NAME) {
            gh release upload $env:GITHUB_REF_NAME $package.FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            $releaseArgs = @(
              'release', 'create', $env:GITHUB_REF_NAME, $package.FullName,
              '--repo', $env:GITHUB_REPOSITORY,
              '--verify-tag', '--generate-notes',
              '--title', "relay $env:RELEASE_VERSION"
            )
            if ($env:RELEASE_VERSION.Contains('-')) {
              $releaseArgs += '--prerelease'
            }
            gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish the release package."
          }
